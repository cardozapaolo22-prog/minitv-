# RetroArch para la MiniTV (/usr/local/share/minitv/retroarch.cfg)
# Lo lanza minitv:  retroarch --config ESTE --appendconfig /run/minitv/retroarch-extra.cfg -L NÚCLEO JUEGO
# (retroarch-extra.cfg lo escribe minitv en cada partida: volumen según AUDIO_GAIN y el volumen del menú)
# RetroArch no guarda nada aquí al salir (config_save_on_exit = false): los cambios se hacen en este archivo.

# ----- Imagen: capa dispmanx del firmware (la copia fbcp-ili9341), 320x240, píxeles nítidos -----
# RetroArch está compilado con un parche (retroarch-dispmanx-minitv.patch) para que dispmanx
# respete la escala entera: el mayor múltiplo entero que quepa, centrado (NES/SNES/GBA/GB a 1x).
video_driver = "dispmanx"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_scale_integer = "true"
video_smooth = "false"
video_aspect_ratio_auto = "true"
video_font_enable = "false"
fps_show = "false"
menu_enable_widgets = "false"
input_overlay_enable = "false"

# ----- Sonido: el mismo camino que VLC (PWM GPIO18 -> PAM8403, mezclado a mono) -----
audio_driver = "alsa"
audio_device = "minitv_mono"
audio_out_rate = "48000"
audio_latency = "96"
audio_sync = "true"

# ----- Controles -----
# Teclado (Bluetooth o USB): flechas, Z = B, X = A, Enter = Start, Shift derecho = Select,
# A/S = Y/X, Q/W = L/R. Esc = volver a la TV. F1 = menú de RetroArch (por si hace falta).
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
# Sin esto, si no hay teclado ni mando conectado al arrancar ("primer arranque"), udev cambia a
# linuxraw, que falla sin terminal, y RetroArch se cierra. Así arranca igual y los detecta al conectarse.
rgui_show_start_screen = "false"
joypad_autoconfig_dir = "/home/paolo/.config/retroarch/autoconfig"
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "x"
input_player1_b = "z"
input_player1_y = "a"
input_player1_x = "s"
input_player1_l = "q"
input_player1_r = "w"
input_player1_start = "enter"
input_player1_select = "rshift"
input_exit_emulator = "escape"
input_menu_toggle = "f1"
quit_press_twice = "false"
# Mando: Select + Start = volver a la TV (los mandos se configuran solos con los perfiles de autoconfig)
input_quit_gamepad_combo = "4"
input_menu_toggle_gamepad_combo = "0"

# ----- Órdenes de minitv (UDP 127.0.0.1:55355): QUIT para volver a la TV, GET_STATUS para saber si ya juega -----
network_cmd_enable = "true"
network_cmd_port = "55355"
stdin_cmd_enable = "false"

# ----- Partidas: la batería del cartucho y un estado automático para continuar donde se quedó -----
savefile_directory = "/home/paolo/juegos/partidas"
savestate_directory = "/home/paolo/juegos/estados"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
savestate_auto_save = "true"
savestate_auto_load = "true"
system_directory = "/home/paolo/juegos/bios"

# ----- Núcleos y opciones -----
libretro_directory = "/usr/local/lib/libretro"
# Los .info de los núcleos (de libretro-core-info). Sin ellos, GET_STATUS hace caer a RetroArch 1.22.2.
libretro_info_path = "/usr/local/share/libretro/info"
core_info_cache_enable = "false"
global_core_options = "true"
core_options_path = "/home/paolo/.config/retroarch/opciones-nucleos.cfg"

# ----- Menú de RetroArch (solo con F1) y cosas que no hacen falta en la MiniTV -----
menu_driver = "rgui"
config_save_on_exit = "false"
pause_nonactive = "false"
history_list_enable = "false"
content_runtime_log = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
cache_directory = "/tmp"
log_verbosity = "false"
