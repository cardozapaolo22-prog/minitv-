# /etc/systemd/system/raspotify.service.d/minitv.conf — ajustes de la MiniTV para raspotify
[Service]
# Corre como paolo para que minitv pueda leer los eventos que deja en /run/raspotify
User=paolo
Group=paolo
# Sin esto, al detenerse borraría la memoria compartida de paolo, que usa el mezclador dmix de VLC
RemoveIPC=false
RuntimeDirectoryMode=0755
UMask=0022
# Si no pudo abrir el audio (lo tenía VLC un instante), volver a intentarlo
Restart=on-failure
RestartSec=2
# librespot 0.8.0 compilado en la Pi (~/compilar/librespot): el del paquete (0.7.1) ya no logra
# reproducir (Spotify le niega las claves de audio). Para volver al del paquete, borrar estas dos líneas.
ExecStart=
ExecStart=/usr/local/bin/librespot
