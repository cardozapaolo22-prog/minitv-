# MiniTV (2026-11-09): Joy-Con izquierdo SUELTO, sostenido de lado, con el driver hid-nintendo del
# kernel 6.1 + joycond. El perfil oficial de libretro usaba otra numeración (botones 14-17) y no servía.
# Botones (orden de RetroArch = orden de código, ver hid-nintendo.c):
#   0 Captura  1 L  2 SL (BTN_TR)  3 ZL  4 SR (BTN_TR2)  5 −  6 clic del stick
#   7 flecha ↑  8 flecha ↓  9 flecha ←  10 flecha →
# De lado (stick a la izquierda): las flechas quedan giradas y hacen de botones A/B/X/Y por posición:
#   derecha = flecha ↓ (A), abajo = flecha ← (B), izquierda = flecha ↑ (Y), arriba = flecha → (X)
# Stick de lado: arriba = X+, abajo = X-, izquierda = Y-, derecha = Y+ (probado en Contra con solo este Joy-Con).
