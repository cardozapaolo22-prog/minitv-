# /etc/systemd/system/bluealsa.service.d/minitv.conf — la MiniTV como parlante Bluetooth
[Service]
# Solo recibir audio (parlante); el volumen del teléfono se aplica por software
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-sink
# No borrar recursos compartidos del usuario paolo al detenerse
RemoveIPC=false
