# MiniTV: dos Joy-Con juntos como un solo mando (dispositivo virtual de joycond).
# Numeración de RetroArch (udev): botones en orden de código desde BTN_MISC:
#   0 B (BTN_SOUTH)  1 A (BTN_EAST)  2 X (BTN_NORTH)  3 Y (BTN_WEST)  4 Captura (BTN_Z)
#   5 L  6 R  7 ZL  8 ZR  9 −  10 +  11 Home  12 L3  13 R3
#   14-17 cruceta (BTN_DPAD_UP/DOWN/LEFT/RIGHT; en este dispositivo no es un hat)
# Ejes: 0/1 stick izquierdo, 2/3 stick derecho (en Linux joycond no crea ejes falsos).
input_driver = "udev"
input_device = "Nintendo Switch Combined Joy-Cons"
# Fabricante y producto exactos que pone joycond al mando virtual (0x057e:0x2008)
input_vendor_id = "1406"
input_product_id = "8200"
input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_screenshot_btn = "4"
input_l_btn = "5"
input_r_btn = "6"
input_l2_btn = "7"
input_r2_btn = "8"
input_select_btn = "9"
input_start_btn = "10"
input_menu_toggle_btn = "11"
input_l3_btn = "12"
input_r3_btn = "13"
input_up_btn = "14"
input_down_btn = "15"
input_left_btn = "16"
input_right_btn = "17"
input_l_x_plus_axis = "+0"
