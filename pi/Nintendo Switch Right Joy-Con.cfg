# Nintendo Switch Right Joy-Con (with nintendo-hid)
# With nintendo-hid, various features such as vibration, gyro, and USB support are available. It appears this will be included in the Linux kernel beginning with version 5.16:
# "Pull HID updates from Jiri Kosina:
#
#    - support for Nintendo Switch Pro Controllers and Joy-Cons (Daniel J.
#      Ogorchock)" - https://cdn.kernel.org/pub/linux/kernel/v5.x/ChangeLog-5.16

input_driver = "udev"
input_device = "Nintendo Switch Right Joy-Con"

input_vendor_id = "1406"
# Producto exacto: si no, los perfiles de los mandos NES de Switch Online (mismo 8199) le ganan
input_product_id = "8199"
# input_product_id = "8199"

input_b_btn = "1"
input_y_btn = "0"
input_select_btn = "9"
input_start_btn = "8"
input_up_axis = "-0"
input_down_axis = "+0"
input_left_axis = "+1"
input_right_axis = "-1"
input_a_btn = "2"
input_x_btn = "3"
input_l_btn = "4"
input_r_btn = "6"


input_b_btn_label = "A"
input_y_btn_label = "B"
input_select_btn_label = "Select"
input_start_btn_label = "Start"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
input_a_btn_label = "X"
input_x_btn_label = "Y"
input_l_btn_label = "L"
input_r_btn_label = "R"


# MiniTV (2026-11-09): direcciones medidas con este driver (hid-nintendo del kernel 6.1 + joycond),
# Joy-Con derecho de lado (medido): izquierda = RY+ (+1), derecha = RY- (-1); arriba = RX- (-0), abajo = RX+ (+0).
# Se agrega el stick analógico (mismo sentido).
input_l_x_plus_axis = "-1"
input_l_x_minus_axis = "+1"
input_l_y_plus_axis = "+0"
input_l_y_minus_axis = "-0"
# Home ya no abre el menú de RetroArch (quedaba asignado a Select y al menú a la vez).
