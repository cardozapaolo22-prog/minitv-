# /etc/asound.conf — audio de la MiniTV
# Salida: PWM por GPIO18 (canal izquierdo de la tarjeta "Headphones") -> PAM8403.
# "minitv_mono" mezcla L+R del video a mono y la envía a ambos canales PWM
# (solo el GPIO18 está conectado al amplificador).

pcm.minitv_mono {
    type plug
    slave {
        pcm "hw:CARD=Headphones,DEV=0"
        channels 2
    }
    ttable {
        0.0 0.5
        1.0 0.5
        0.1 0.5
        1.1 0.5
    }
}

pcm.!default minitv_mono
ctl.!default {
    type hw
    card Headphones
}

# Spotify Connect (librespot / raspotify, desde 2026-11-08): misma salida que minitv_mono, con el
# mismo límite que AUDIO_GAIN=0.5 (-6 dB): 0.25 = 0.5 de la mezcla a mono x 0.5 de ganancia.
# La tarjeta no se comparte (dmix no funciona bien con este audio PWM): minitv detiene VLC antes
# de que suene Spotify y corta Spotify al volver a la TV.
pcm.minitv_spotify {
    type plug
    slave {
        pcm "hw:CARD=Headphones,DEV=0"
        channels 2
    }
    ttable {
        0.0 0.25
        1.0 0.25
        0.1 0.25
        1.1 0.25
    }
}
