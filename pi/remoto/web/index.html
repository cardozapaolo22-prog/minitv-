<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paolo TV</title>
<meta name="theme-color" content="#16181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paolo TV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --plata1: #f3f5f7; --plata2: #c9ced5; --plata3: #9aa1aa; --tinta: #2f343b;
  --azul: #2a6fd6; --azul-borde: #9fdcff; --rojo: #d9231a; --gris: #3b3f45;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; background: #16181c; color: var(--tinta);
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
body { display: flex; justify-content: center; align-items: center; touch-action: manipulation;
  padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
button { font: inherit; color: inherit; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }

/* ---------- control remoto ---------- */
#control { width: 100%; max-width: 360px; height: min(100%, 760px); display: flex; flex-direction: column;
  justify-content: space-between; gap: 10px; padding: 22px 22px 26px; border-radius: 46px 46px 60px 60px;
  background: linear-gradient(100deg, var(--plata2) 0%, var(--plata1) 22%, #dfe3e8 48%, var(--plata1) 70%, var(--plata3) 100%);
  box-shadow: inset 0 2px 1px #fff, inset 0 -3px 6px rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.6); }
.fila { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.marca { font-weight: 900; font-size: 24px; letter-spacing: 3px; white-space: nowrap; color: #4a5059;
  text-shadow: 0 1px 0 #fff, 0 -1px 0 rgba(0,0,0,.25); padding-left: 6px; }
.btn { border-radius: 999px; transition: transform .06s, filter .06s; }
.btn.apretado { transform: scale(.94); filter: brightness(.88); }
#encendido { width: 62px; height: 62px; border-radius: 50%; color: #fff; font-size: 28px; line-height: 62px;
  background: radial-gradient(circle at 35% 30%, #ff8178, var(--rojo) 55%, #8d0e08);
  box-shadow: 0 3px 0 #6b0a06, 0 6px 12px rgba(0,0,0,.35), inset 0 1px 2px rgba(255,255,255,.5); }
#encendido.reposo { animation: latido 1.6s ease-in-out infinite; }
@keyframes latido { 50% { box-shadow: 0 3px 0 #6b0a06, 0 0 18px 4px rgba(255,60,40,.7); } }
#pantallita { background: #0d1a14; color: #7dffb2; border-radius: 10px; padding: 7px 12px; font: 600 14px/1.25 ui-monospace, Menlo, monospace;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.8), 0 1px 0 #fff; min-height: 34px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cruz { position: relative; width: min(74vw, 262px); aspect-ratio: 1; margin: 4px auto; border-radius: 50%;
  background: radial-gradient(circle, #e8ebef 0 30%, #c4c9d0 31% 100%);
  box-shadow: 0 4px 0 #8c939c, 0 8px 18px rgba(0,0,0,.3), inset 0 2px 2px #fff, inset 0 -3px 6px rgba(0,0,0,.2); }
.flecha { position: absolute; width: 34%; height: 34%; font-size: 26px; color: #4a5059; border-radius: 16px; background: transparent; }
.flecha.apretado { background: rgba(0,0,0,.12); }
#arriba { top: 1%; left: 33%; } #abajo { bottom: 1%; left: 33%; } #izquierda { left: 1%; top: 33%; } #derecha { right: 1%; top: 33%; }
#ok { position: absolute; left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%; color: #fff; font-weight: 800; font-size: 22px;
  background: radial-gradient(circle at 35% 30%, #5c9bf0, var(--azul) 60%, #1b4ea0); border: 3px solid var(--azul-borde);
  box-shadow: 0 3px 0 #163f84, 0 6px 14px rgba(0,0,0,.35), inset 0 1px 2px rgba(255,255,255,.5); }
.par { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.plata { height: 56px; font-weight: 700; font-size: 17px; color: #3a3f47;
  background: linear-gradient(#fbfcfd, #cfd4da); box-shadow: 0 3px 0 #8c939c, 0 5px 10px rgba(0,0,0,.25), inset 0 1px 1px #fff; }
.oscuro { height: 56px; font-size: 22px; color: #e9edf2; background: linear-gradient(#5a5f67, var(--gris));
  box-shadow: 0 3px 0 #1f2226, 0 5px 10px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.25); }
#volumen { display: grid; grid-template-columns: 62px 1fr 62px; align-items: center; gap: 10px; padding: 6px;
  border-radius: 999px; background: linear-gradient(#b9bfc7, #e3e7eb); box-shadow: inset 0 2px 5px rgba(0,0,0,.3), 0 1px 0 #fff; }
#volumen .plata { height: 50px; font-size: 26px; }
#nivel { height: 12px; border-radius: 6px; background: #20242a; overflow: hidden; box-shadow: inset 0 1px 3px #000; position: relative; }
#nivel i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #39d17b, #9fdcff); }
#vol-txt { text-align: center; font-size: 11px; font-weight: 700; color: #5a6069; margin-top: 3px; letter-spacing: 2px; }
#ir-mando, #ir-admin { height: 46px; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none; }

/* ---------- aviso sin conexión ---------- */
#aviso { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px); z-index: 50; display: none;
  background: #b3261e; color: #fff; padding: 14px 16px; border-radius: 14px; font-size: 15px; line-height: 1.35; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.5); text-align: center; }
#aviso.visible { display: block; }

/* ---------- modo mando: un mando plateado de consola, a juego con el control ---------- */
#mando { position: fixed; inset: 0; z-index: 20; display: none; touch-action: none; overflow: hidden;
  background: radial-gradient(ellipse at 50% 30%, #2a2e35, #101215 75%); }
body.en-mando #control { display: none; }
body.en-mando #mando { display: block; }
#girar { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
  gap: 14px; font-size: 20px; text-align: center; padding: 30px; background: #16181c; color: #dfe4ea; z-index: 5; }
#girar b { font-size: 60px; color: #9fdcff; animation: girar 1.8s ease-in-out infinite; }
@keyframes girar { 50% { transform: rotate(90deg); } }
@media (orientation: portrait) { #girar { display: flex; } }

.cuerpo { position: absolute; top: 13vh; bottom: 4vh; left: max(2.5vw, env(safe-area-inset-left)); right: max(2.5vw, env(safe-area-inset-right));
  border-radius: 45vh; background: linear-gradient(100deg, var(--plata2) 0%, var(--plata1) 20%, #dfe3e8 50%, var(--plata1) 78%, var(--plata3) 100%);
  box-shadow: inset 0 3px 2px #fff, inset 0 -6px 12px rgba(0,0,0,.28), 0 14px 30px rgba(0,0,0,.65); }
.gatillo { position: absolute; top: 4vh; width: min(26vw, 52vh); height: 15vh; z-index: 0; display: flex; align-items: flex-start;
  justify-content: center; padding-top: 2.2vh; font: 800 4.2vh/1 -apple-system, sans-serif; color: #4a5059;
  background: linear-gradient(#e9ecef, #a9b0b8); border-radius: 6vh 6vh 2vh 2vh;
  box-shadow: inset 0 2px 1px #fff, 0 3px 6px rgba(0,0,0,.5); transition: transform .05s; }
#b-l { left: calc(max(2.5vw, env(safe-area-inset-left)) + 7vw); }
#b-r { right: calc(max(2.5vw, env(safe-area-inset-right)) + 7vw); }
.gatillo.on { transform: translateY(1.2vh); filter: brightness(.9); }

.pozo { position: absolute; top: 50%; transform: translateY(-50%); width: min(66vh, 34vw); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #b9bfc7, #9aa1aa);
  box-shadow: inset 0 4px 10px rgba(0,0,0,.35), inset 0 -2px 2px rgba(255,255,255,.7), 0 1px 0 #fff; }
.pozo.izq { left: 4vh; }
.pozo.der { right: 4vh; background: radial-gradient(circle at 50% 40%, #4a4f57, #2b2f35); }

#dpad { position: absolute; inset: 11%; }
#dpad .brazo { position: absolute; background: linear-gradient(145deg, #4b5058, #24272c);
  box-shadow: 0 0.8vh 0 #15171a, 0 1.4vh 2vh rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.18); }
#dpad .v { left: 34%; width: 32%; top: 0; height: 100%; border-radius: 1.6vh; }
#dpad .h { top: 34%; height: 32%; left: 0; width: 100%; border-radius: 1.6vh; }
#dpad .cubo { position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; border-radius: 50%;
  background: radial-gradient(circle, #2a2d32 0 40%, transparent 42%); }
#dpad .marca-d { position: absolute; color: #8f98a3; font-size: 4.6vh; line-height: 1; transition: color .05s; }
#dpad .marca-d.on { color: #9fdcff; text-shadow: 0 0 1.5vh #9fdcff; }

.rombo { position: absolute; inset: 9%; }
.rombo .mb { position: absolute; width: 33%; height: 33%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font: 900 5.6vh/1 -apple-system, sans-serif; color: rgba(255,255,255,.92); text-shadow: 0 -1px 0 rgba(0,0,0,.35);
  box-shadow: 0 1vh 0 rgba(0,0,0,.55), 0 1.6vh 2vh rgba(0,0,0,.4), inset 0 0.5vh 0.6vh rgba(255,255,255,.45), inset 0 -0.6vh 1vh rgba(0,0,0,.25);
  transition: transform .05s, box-shadow .05s; }
.rombo .mb.on { transform: translateY(0.8vh); box-shadow: 0 0.2vh 0 rgba(0,0,0,.55), inset 0 0.6vh 1vh rgba(0,0,0,.35); }
#b-x { left: 33.5%; top: 0; background: radial-gradient(circle at 35% 28%, #7fb2ff, #2a6fd6 60%, #174289); }
#b-a { right: 0; top: 33.5%; background: radial-gradient(circle at 35% 28%, #ff8a80, #d9231a 60%, #870d08); }
#b-b { left: 33.5%; bottom: 0; background: radial-gradient(circle at 35% 28%, #ffe58a, #e3ae00 60%, #957100); color: #4a3a00; text-shadow: none; }
#b-y { left: 0; top: 33.5%; background: radial-gradient(circle at 35% 28%, #d3d7dc, #8a9099 60%, #565b63); }

.medio { position: absolute; top: 0; bottom: 0; left: calc(4vh + min(66vh, 34vw)); right: calc(4vh + min(66vh, 34vw));
  display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 3vh 0; }
.marca-m { font: 900 5.4vh/1 -apple-system, sans-serif; letter-spacing: 0.6vh; color: #4a5059; white-space: nowrap; text-shadow: 0 1px 0 #fff, 0 -1px 0 rgba(0,0,0,.25); }
#jugador { background: #0d1a14; color: #7dffb2; border-radius: 1.2vh; padding: 1vh 2.4vh; font: 700 3.2vh/1.2 ui-monospace, Menlo, monospace;
  box-shadow: inset 0 0.4vh 1vh rgba(0,0,0,.8), 0 1px 0 #fff; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.selstart { display: flex; gap: 4vh; }
.ss { display: flex; flex-direction: column; align-items: center; gap: 1vh; font: 800 2.4vh/1 -apple-system, sans-serif; letter-spacing: .3vh; color: #5a6069; }
.ranura { padding: 0.9vh; border-radius: 99px; background: #aab0b8; box-shadow: inset 0 0.4vh 0.8vh rgba(0,0,0,.35), 0 1px 0 #fff; transform: rotate(-22deg); }
.pildora { width: 11vh; height: 4vh; border-radius: 99px; background: linear-gradient(#5a5f67, #2c3036);
  box-shadow: 0 0.6vh 0 #15171a, inset 0 1px 1px rgba(255,255,255,.25); transition: transform .05s; }
.pildora.on { transform: translateY(0.5vh); box-shadow: 0 0.1vh 0 #15171a; }
.acciones { display: flex; gap: 2vh; }
.chico { height: 7.5vh; padding: 0 2.6vh; border-radius: 99px; font: 700 2.6vh/1 -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center; white-space: nowrap; }
#volver-control { color: #3a3f47; background: linear-gradient(#fbfcfd, #cfd4da); box-shadow: 0 0.6vh 0 #8c939c, inset 0 1px 1px #fff; }
#salir-juego { color: #fff; background: linear-gradient(#e0473e, #a5160f); box-shadow: 0 0.6vh 0 #5e0b07, inset 0 1px 1px rgba(255,255,255,.35); }
.chico:active { transform: translateY(0.4vh); }
#haptico { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div id="aviso">No encuentro la TV. Revisa que estés en la red MiniTV o en tu wifi de casa.</div>

<main id="control">
  <div class="fila">
    <div class="marca">PAOLO TV</div>
    <button id="encendido" class="btn" data-o="encendido" aria-label="Encender o apagar">⏻</button>
  </div>
  <div id="pantallita">Buscando la TV…</div>
  <div id="cruz">
    <button class="flecha" id="arriba" data-o="sube" data-repite aria-label="Arriba">▲</button>
    <button class="flecha" id="izquierda" data-o="izquierda" data-repite aria-label="Izquierda">◀</button>
    <button class="flecha" id="derecha" data-o="derecha" data-repite aria-label="Derecha">▶</button>
    <button class="flecha" id="abajo" data-o="baja" data-repite aria-label="Abajo">▼</button>
    <button id="ok" class="btn" data-o="ok">OK</button>
  </div>
  <div class="par">
    <button class="btn plata" data-o="inicio">Menú</button>
    <button class="btn plata" data-o="atras">Atrás</button>
  </div>
  <div class="par">
    <button class="btn oscuro" data-o="pausa" aria-label="Play o pausa">▶❚❚</button>
    <button class="btn oscuro" data-o="stop" aria-label="Stop">■</button>
  </div>
  <div>
    <div id="volumen">
      <button class="btn plata" data-o="vol-" data-repite aria-label="Bajar volumen">−</button>
      <div><div id="nivel"><i></i></div><div id="vol-txt">VOLUMEN</div></div>
      <button class="btn plata" data-o="vol+" data-repite aria-label="Subir volumen">+</button>
    </div>
  </div>
  <div class="par">
    <button id="ir-mando" class="btn oscuro">🎮 Modo mando</button>
    <a id="ir-admin" class="btn oscuro" href="admin.html">⚙️ Administrar</a>
  </div>
</main>

<section id="mando">
  <div id="girar"><b>📱</b>Gira el celular en horizontal para jugar
    <button class="chico" id="volver-control-v" style="background:#2a6fd6;color:#fff;margin-top:6px">📺 Volver al control</button></div>
  <div class="gatillo mb" id="b-l" data-bit="4">L</div>
  <div class="gatillo mb" id="b-r" data-bit="5">R</div>
  <div class="cuerpo">
    <div class="pozo izq">
      <div id="dpad">
        <div class="brazo v"></div><div class="brazo h"></div><div class="cubo"></div>
        <span class="marca-d" data-d="8" style="left:50%;top:7%;transform:translateX(-50%)">▲</span>
        <span class="marca-d" data-d="9" style="left:50%;bottom:7%;transform:translateX(-50%)">▼</span>
        <span class="marca-d" data-d="10" style="left:7%;top:50%;transform:translateY(-50%)">◀</span>
        <span class="marca-d" data-d="11" style="right:7%;top:50%;transform:translateY(-50%)">▶</span>
      </div>
    </div>
    <div class="medio">
      <div class="marca-m">PAOLO TV</div>
      <div id="jugador">Conectando…</div>
      <div class="selstart">
        <div class="ss"><div class="ranura"><div class="pildora mb" data-bit="6"></div></div>SELECT</div>
        <div class="ss"><div class="ranura"><div class="pildora mb" data-bit="7"></div></div>START</div>
      </div>
      <div class="acciones">
        <button class="chico" id="volver-control">📺 Control</button>
        <button class="chico" id="salir-juego">✕ Salir del juego</button>
      </div>
    </div>
    <div class="pozo der">
      <div class="rombo">
        <div class="mb" id="b-x" data-bit="2">X</div>
        <div class="mb" id="b-y" data-bit="3">Y</div>
        <div class="mb" id="b-a" data-bit="1">A</div>
        <div class="mb" id="b-b" data-bit="0">B</div>
      </div>
    </div>
  </div>
</section>
<label id="haptico"><input type="checkbox" switch id="haptico-in"></label>

<script>
"use strict";
const $ = s => document.querySelector(s);
const aviso = $("#aviso"), pantallita = $("#pantallita");
let ws = null, ultimoMensaje = 0, enMando = false, mascara = 0;

/* --- vibración: Android con navigator.vibrate; iPhone (iOS 18+) con el interruptor nativo --- */
const hapIn = $("#haptico-in"), hapLabel = $("#haptico");
function vibrar(ms) {
  if (navigator.vibrate) { navigator.vibrate(ms); return; }
  try { hapLabel.click(); } catch (e) {}
}

/* --- conexión con la TV --- */
function conectar() {
  try { ws = new WebSocket(`ws://${location.host}/ws`); } catch (e) { setTimeout(conectar, 1000); return; }
  ws.onopen = () => { ultimoMensaje = Date.now(); ws.send("h"); if (enMando) ws.send("m:on"); };
  ws.onmessage = ev => {
    ultimoMensaje = Date.now();
    const m = ev.data;
    if (m.startsWith("e:")) mostrarEstado(JSON.parse(m.slice(2)));
    else if (m.startsWith("j:")) $("#jugador").textContent = m === "j:0" ? "Sin mando (¿ya hay 4 jugadores?)" : `Jugador ${m.slice(2)}`;
  };
  ws.onclose = () => { ws = null; setTimeout(conectar, 800); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
function abierto() { return ws && ws.readyState === 1; }
function mandar(t) { if (abierto()) { ws.send(t); return true; } aviso.classList.add("visible"); return false; }
setInterval(() => {
  if (abierto()) ws.send("h");
  aviso.classList.toggle("visible", !abierto() || Date.now() - ultimoMensaje > 4500);
}, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !abierto()) conectar(); });

const NOMBRES = { menu: "Menú", tv: "En el aire", juego: "Jugando", musica: "Música", sin_senal: "Sin señal",
                  reposo: "En reposo", sin_tv: "La TV se está iniciando…" };
function mostrarEstado(e) {
  let t = NOMBRES[e.modo] || e.modo;
  if (e.titulo) t += " · " + e.titulo;
  if (e.pausa) t += " · ❚❚";
  pantallita.textContent = t;
  $("#encendido").classList.toggle("reposo", e.modo === "reposo");
  if (typeof e.volumen === "number") $("#nivel i").style.width = e.volumen + "%";
}

/* --- botones del control: al apretar (no al soltar), con repetición en flechas y volumen --- */
document.querySelectorAll("[data-o]").forEach(b => {
  let rep = null, espera = null;
  const parar = () => { clearTimeout(espera); clearInterval(rep); rep = espera = null; b.classList.remove("apretado"); };
  b.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    b.classList.add("apretado");
    vibrar(12);
    mandar("o:" + b.dataset.o);
    if (b.hasAttribute("data-repite"))
      espera = setTimeout(() => { rep = setInterval(() => mandar("o:" + b.dataset.o), 160); }, 420);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => b.addEventListener(t, parar));
  b.addEventListener("contextmenu", ev => ev.preventDefault());
});

/* --- sin zoom: Safari del iPhone ignora user-scalable=no, así que se cancelan aquí el doble toque y el
   pellizco (en el modo mando, todos los toques: ahí solo cuentan los eventos "pointer") --- */
let ultimoToque = 0;
document.addEventListener("touchstart", ev => {
  if (enMando || ev.touches.length > 1) ev.preventDefault();
}, { passive: false });
document.addEventListener("touchend", ev => {
  const t = Date.now();
  if (enMando || t - ultimoToque < 400) ev.preventDefault();
  ultimoToque = t;
}, { passive: false });
["gesturestart", "gesturechange", "gestureend", "dblclick"].forEach(t =>
  document.addEventListener(t, ev => ev.preventDefault(), { passive: false }));
function quitarZoom() {          // si ya quedó agrandado, volver al tamaño normal
  const m = document.querySelector('meta[name="viewport"]');
  const c = m.content;
  m.content = c.replace("maximum-scale=1", "maximum-scale=1.01");
  requestAnimationFrame(() => { m.content = c; });
}

/* --- modo mando --- */
function entrarMando() {
  enMando = true; mascara = 0;
  quitarZoom();
  document.body.classList.add("en-mando");
  $("#jugador").textContent = "Conectando…";
  mandar("m:on");
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen({ navigationUI: "hide" })
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape")).catch(() => {});
}
function salirMando() {
  enMando = false; toques.clear(); poner(0);
  mandar("m:off");
  document.body.classList.remove("en-mando");
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
$("#ir-mando").addEventListener("pointerdown", ev => { ev.preventDefault(); vibrar(12); entrarMando(); });
["#volver-control", "#volver-control-v"].forEach(s => $(s).addEventListener("pointerdown", ev => { ev.preventDefault(); vibrar(12); salirMando(); }));
$("#salir-juego").addEventListener("pointerdown", ev => { ev.preventDefault(); vibrar(20); mandar("o:stop"); });

const dpad = $("#dpad"), toques = new Map();     // pointerId -> bits que aprieta ese dedo
function bitsEn(x, y) {
  const r = dpad.getBoundingClientRect();
  if (x >= r.left - 20 && x <= r.right + 20 && y >= r.top - 20 && y <= r.bottom + 20) {
    const dx = (x - (r.left + r.width / 2)) / (r.width / 2), dy = (y - (r.top + r.height / 2)) / (r.height / 2);
    if (Math.hypot(dx, dy) < 0.18) return 0;                       // centro: nada
    let b = 0;                                                     // diagonales cuando ambos ejes pesan
    if (dy < 0 && Math.abs(dy) > 0.4 * Math.abs(dx)) b |= 1 << 8;
    if (dy > 0 && Math.abs(dy) > 0.4 * Math.abs(dx)) b |= 1 << 9;
    if (dx < 0 && Math.abs(dx) > 0.4 * Math.abs(dy)) b |= 1 << 10;
    if (dx > 0 && Math.abs(dx) > 0.4 * Math.abs(dy)) b |= 1 << 11;
    return b;
  }
  const el = document.elementFromPoint(x, y);
  const boton = el && el.closest("[data-bit]");
  return boton ? 1 << +boton.dataset.bit : 0;
}
function poner(nueva) {
  if (nueva === mascara) return;
  if (nueva & ~mascara) vibrar(8);
  mascara = nueva;
  if (abierto()) ws.send("p:" + mascara);
  document.querySelectorAll("#mando [data-bit]").forEach(b => b.classList.toggle("on", !!(mascara & (1 << +b.dataset.bit))));
  document.querySelectorAll("#dpad [data-d]").forEach(b => b.classList.toggle("on", !!(mascara & (1 << +b.dataset.d))));
}
function recalcular() { let m = 0; toques.forEach(b => m |= b); poner(m); }
const mandoEl = $("#mando");
mandoEl.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".chico")) return;
  ev.preventDefault();
  try { mandoEl.setPointerCapture(ev.pointerId); } catch (e) {}
  toques.set(ev.pointerId, bitsEn(ev.clientX, ev.clientY)); recalcular();
});
mandoEl.addEventListener("pointermove", ev => {
  if (!toques.has(ev.pointerId)) return;
  const b = bitsEn(ev.clientX, ev.clientY);
  if (b !== toques.get(ev.pointerId)) { toques.set(ev.pointerId, b); recalcular(); }
});
["pointerup", "pointercancel"].forEach(t => mandoEl.addEventListener(t, ev => { toques.delete(ev.pointerId); recalcular(); }));
mandoEl.addEventListener("contextmenu", ev => ev.preventDefault());
window.addEventListener("blur", () => { toques.clear(); poner(0); });

conectar();
</script>
